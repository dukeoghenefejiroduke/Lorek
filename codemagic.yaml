workflows:  
  build-android:
    name: Build Android
    # If package.json is in the root of your repo, change this to:
    # working_directory: . 
    working_directory: mobile
    environment:
      node: 20
      groups:
        - android_credentials
    scripts:
      - name: Debug Directory
        script: |
          echo "Current directory is: $(pwd)"
          ls -F
      - name: Install dependencies
        script: |
          npm install
      - name: Prebuild Android
        script: |
          npx expo prebuild --clean
      - name: Build Android AAB and APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/apk/release/*.apk

  build-ios:
    name: Build iOS
    environment:
      node: 20
      groups:
        - ios_credentials
    scripts:
      - name: Install dependencies
        script: |
          cd mobile
          npm install
      - name: Build iOS IPA
        script: |
          cd mobile
          npx expo export:ios --platform ios --type archive
    artifacts:
      - mobile/ios/build/*.ipa
