workflows:
  build-android:
    name: Build Android
    working_directory: .
    environment:
      node: 20
      groups:
        - android_credentials
    scripts:
      - name: Debug File System
        script: |
          echo "Listing all files to find package.json:"
          find . -name "package.json"
          echo "Current directory contents:"
          ls -F
      - name: Install dependencies
        script: |
          # If 'find' shows ./mobile/package.json, this works.
          # If 'find' shows ./package.json, change this to 'npm install'
          cd mobile && npm install
      - name: Prebuild Android
        script: |
          cd mobile && npx expo prebuild --clean
      - name: Build Android
        script: |
          cd mobile/android && chmod +x gradlew && ./gradlew bundleRelease assembleRelease
    artifacts:
      - mobile/android/app/build/outputs/bundle/release/*.aab
      - mobile/android/app/build/outputs/apk/release/*.apk

  build-ios:
    name: Build iOS
    environment:
      node: 20
      groups:
        - ios_credentials
    scripts:
      - name: Install dependencies
        script: |
          cd mobile && npm install
      - name: Build iOS IPA
        script: |
          cd mobile && npx expo export:ios --platform ios --type archive
    artifacts:
      - mobile/ios/build/*.ipa
