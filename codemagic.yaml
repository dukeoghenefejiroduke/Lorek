workflows:
  build-android:
    name: Build Android
    environment:
      node: 20
      groups:
        - android_credentials
    scripts:
      - name: Debug working directory
        script: |
          pwd
          ls -F
      - name: Install dependencies
        script: |
          cd mobile
          npm install
      - name: Build Android AAB and APK
        script: |
          cd mobile
          npx expo prebuild --clean
          cd android
          ./gradlew bundleRelease assembleRelease
    artifacts:
      - mobile/android/app/build/outputs/bundle/release/*.aab

  build-ios:
    name: Build iOS
    environment:
      node: 20
      groups:
        - ios_credentials
    scripts:
      - name: Install dependencies
        script: |
          cd mobile
          npm install
      - name: Build iOS IPA
        script: |
          cd mobile
          npx expo export:ios --platform ios --type archive
    artifacts:
      - mobile/ios/build/*.ipa
