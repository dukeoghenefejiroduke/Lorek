workflows:
  build-android:
    name: Build Android
    working_directory: .
    environment:
      node: 20
      groups:
        - android_credentials
    scripts:
      - name: Install dependencies
        script: |
          # Only run install if there is a package.json in mobile
          if [ -f "mobile/package.json" ]; then
            cd mobile && npm install
          else
            echo "ERROR: mobile/package.json not found!"
            exit 1
          fi
      - name: Prebuild Android
        script: |
          cd mobile && npx expo prebuild --clean
      - name: Build Android
        script: |
          cd mobile/android && chmod +x gradlew && ./gradlew bundleRelease assembleRelease
    artifacts:
      - mobile/android/app/build/outputs/bundle/release/*.aab
      - mobile/android/app/build/outputs/apk/release/*.apk

  build-ios:
    name: Build iOS
    environment:
      node: 20
      groups:
        - ios_credentials
    scripts:
      - name: Install dependencies
        script: |
          cd mobile && npm install
      - name: Build iOS IPA
        script: |
          cd mobile && npx expo export:ios --platform ios --type archive
    artifacts:
      - mobile/ios/build/*.ipa
