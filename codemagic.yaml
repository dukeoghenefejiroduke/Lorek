workflows:
  build-android:
    name: Build Android
    environment:
      node: 20
      groups:
        - android_credentials
    scripts:
      - name: Install dependencies
        script: |
          cd mobile
          npm install
      - name: Prebuild Android
        script: |
          cd mobile
          npm run prebuild -- --clean --platform android
      - name: Build Android
        script: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease
    artifacts:
      - mobile/android/app/build/outputs/bundle/release/*.aab
      - mobile/android/app/build/outputs/apk/release/*.apk

  build-ios:
    name: Build iOS
    environment:
      node: 20
      groups:
        - ios_credentials
    scripts:
      - name: Install dependencies
        script: |
          cd mobile
          npm install
      - name: Build iOS IPA
        script: |
          cd mobile
          npx expo export:ios --platform ios --type archive
    artifacts:
      - mobile/ios/build/*.ipa
