workflows:     
 build-android:
    name: Build Android
    working_directory: .
    environment:
      node: 20
      groups:
        - android_credentials
    scripts:
      - name: Locate package.json
        script: |
          find . -name "package.json"
      - name: Install dependencies
        script: |
          # Use the path discovered by the first script
          # If it's in /mobile, use: cd mobile && npm install
          cd mobile && npm install
      - name: Prebuild Android
        script: |
          cd mobile && npx expo prebuild --clean
      - name: Build Android
        script: |
          cd mobile/android && chmod +x gradlew && ./gradlew bundleRelease assembleRelease

  build-ios:
    name: Build iOS
    environment:
      node: 20
      groups:
        - ios_credentials
    scripts:
      - name: Install dependencies
        script: |
          cd mobile
          npm install
      - name: Build iOS IPA
        script: |
          cd mobile
          npx expo export:ios --platform ios --type archive
    artifacts:
      - mobile/ios/build/*.ipa
