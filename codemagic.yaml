workflows:   
  build-android:
    name: Build Android
    # Change working_directory to the root
    working_directory: .
    environment:
      node: 20
      groups:
        - android_credentials
    scripts:
      - name: Install dependencies
        script: |
          # Now running from the root, so navigate to mobile first
          cd mobile
          npm install
      - name: Prebuild Android
        script: |
          # Navigate into mobile to run prebuild
          cd mobile
          npx expo prebuild --clean
      - name: Build Android AAB and APK
        script: |
          # Navigate into the generated android folder
          cd mobile/android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease
    artifacts:
      - mobile/android/app/build/outputs/bundle/release/*.aab
      - mobile/android/app/build/outputs/apk/release/*.apk
      
  build-ios:
    name: Build iOS
    environment:
      node: 20
      groups:
        - ios_credentials
    scripts:
      - name: Install dependencies
        script: |
          cd mobile
          npm install
      - name: Build iOS IPA
        script: |
          cd mobile
          npx expo export:ios --platform ios --type archive
    artifacts:
      - mobile/ios/build/*.ipa
