workflows:
  build-android:
    name: Build Android
    working_directory: mobile
    environment:
      node: 20
      groups:
        - android_credentials
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Prebuild Android
        script: |
          # Cleans and generates the native android directory
          npx expo prebuild --clean
      - name: Build Android AAB and APK
        script: |
          # Navigate into the generated android folder
          cd android
          # Ensure gradlew has execution permissions
          chmod +x gradlew
          # Run the build
          ./gradlew bundleRelease assembleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/apk/release/*.apk

  build-ios:
    name: Build iOS
    environment:
      node: 20
      groups:
        - ios_credentials
    scripts:
      - name: Install dependencies
        script: |
          cd mobile
          npm install
      - name: Build iOS IPA
        script: |
          cd mobile
          npx expo export:ios --platform ios --type archive
    artifacts:
      - mobile/ios/build/*.ipa
