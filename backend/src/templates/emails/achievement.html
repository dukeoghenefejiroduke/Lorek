<div style="font-family: sans-serif; max-width: 600px; margin: auto; padding: 20px; text-align: center; background-color: #f9f9f9;">
  <h1 style="font-size: 40px;">🏆</h1>
  <h2 style="color: #ff9800;">Achievement Unlocked!</h2>
  <p>Amazing work, {{username}}!</p>
  <div style="background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
    <img src="{{badgeImage}}" alt="Badge" style="width: 100px; height: 100px;">
    <h3>{{achievementName}}</h3>
    <p style="color: #555;">{{achievementDescription}}</p>
  </div>
  <p style="margin-top: 20px;"><a href="{{shareUrl}}" style="color: #1976d2;">Share your progress</a></p>
</div>
