<div style="font-family: sans-serif; max-width: 600px; margin: auto; padding: 20px; border: 1px solid #eee;">
  <h2 style="color: #2e7d32;">Verify Your Email 📧</h2>
  <p>Hi {{username}},</p>
  <p>Welcome to the Izon Language App! Please click the button below to verify your account. This link expires in {{expiresIn}}.</p>
  <div style="text-align: center; margin: 30px 0;">
    <a href="{{verifyUrl}}" style="background-color: #2e7d32; color: white; padding: 12px 25px; text-decoration: none; border-radius: 5px;">Verify Email</a>
  </div>
  <p style="font-size: 12px; color: #666;">If you didn't create an account, you can safely ignore this email.</p>
</div>
