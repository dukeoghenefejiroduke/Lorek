<div style="font-family: sans-serif; max-width: 600px; margin: auto; padding: 20px;">
  <h2 style="color: #d32f2f;">Reset Your Password</h2>
  <p>Hello {{username}},</p>
  <p>We received a request to reset your password. Click the button below to set a new one. This link is valid for {{expiresIn}}.</p>
  <div style="text-align: center; margin: 30px 0;">
    <a href="{{resetUrl}}" style="background-color: #d32f2f; color: white; padding: 12px 25px; text-decoration: none; border-radius: 5px;">Reset Password</a>
  </div>
  <p>If you didn't request this, please secure your account immediately.</p>
</div>
