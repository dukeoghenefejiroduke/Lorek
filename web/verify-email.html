<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verification | Lorek</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Lorek Language App</h1>
    </header>

    <main class="verification-container">
        <h1>Email Verification</h1>
        <div id="status" class="status-message">Verifying your account...</div>
        <div id="spinner" class="spinner"></div>
    </main>

    <footer>
        <p>&copy; 2026 Lorek App. All rights reserved.</p>
    </footer>

    <script>
        async function verifyEmail() {
            let urlParams = new URLSearchParams(window.location.search);
            let token = urlParams.get('token');
            
            if (!token && window.location.hash) {
                const hashParams = new URLSearchParams(window.location.hash.substring(1));
                token = hashParams.get('token');
            }
            
            const statusDiv = document.getElementById('status');
            const spinner = document.getElementById('spinner');

            if (!token) {
                statusDiv.innerHTML = '<span style="color: #d32f2f; font-weight: bold;">Error:</span> No verification token found in URL.';
                spinner.style.display = 'none';
                return;
            }

            try {
                const response = await fetch('https://lorek.onrender.com/api/auth/verify-email', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    statusDiv.innerHTML = '<span style="color: #2e7d32; font-weight: bold;">Success!</span> Your email has been verified. You can now log in to the app.';
                } else {
                    statusDiv.innerHTML = '<span style="color: #d32f2f; font-weight: bold;">Error:</span> ' + (data.error || 'Verification failed.');
                }
            } catch (error) {
                statusDiv.innerHTML = '<span style="color: #d32f2f; font-weight: bold;">Error:</span> Could not connect to the server. (' + error.message + ')';
            } finally {
                spinner.style.display = 'none';
            }
        }

        verifyEmail();
    </script>
</body>
</html>
