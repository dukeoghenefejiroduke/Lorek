<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Learning Report | Lorek</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Lorek Language App</h1>
    </header>

    <main class="container">
        <div style="font-size: 64px; margin-bottom: 15px;">📊</div>
        <h1 style="color: #2e7d32; font-size: 1.5rem; margin-bottom: 10px;">Your Weekly Report</h1>
        <p>Here is a summary of your recent progress in Izon Language Learning:</p>
        
        <div style="display: flex; justify-content: space-around; margin: 20px 0; background: #f1f8e9; padding: 15px; border-radius: 12px;">
            <div style="text-align: center;">
                <h3 id="stat-lessons" style="margin: 0; color: #2e7d32; font-size: 22px;">0</h3>
                <p style="margin: 5px 0 0; color: #555; font-size: 13px;">Lessons</p>
            </div>
            <div style="text-align: center;">
                <h3 id="stat-words" style="margin: 0; color: #2e7d32; font-size: 22px;">0</h3>
                <p style="margin: 5px 0 0; color: #555; font-size: 13px;">Words</p>
            </div>
            <div style="text-align: center;">
                <h3 id="stat-points" style="margin: 0; color: #2e7d32; font-size: 22px;">0</h3>
                <p style="margin: 5px 0 0; color: #555; font-size: 13px;">Points</p>
            </div>
        </div>

        <a href="index.html" class="btn">Open Lorek App Dashboard</a>
    </main>

    <footer>
        <p>&copy; 2026 Lorek App. All rights reserved.</p>
    </footer>

    <script>
        if (window.location.hash) {
            const hashParams = new URLSearchParams(window.location.hash.substring(1));
            const lessons = hashParams.get('lessons');
            const words = hashParams.get('words');
            const points = hashParams.get('points');

            if (lessons) document.getElementById('stat-lessons').innerText = lessons;
            if (words) document.getElementById('stat-words').innerText = words;
            if (points) document.getElementById('stat-points').innerText = points;
        }
    </script>
</body>
</html>
