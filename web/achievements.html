<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Achievement Unlocked | Lorek</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Lorek Language App</h1>
    </header>

    <main class="container">
        <div id="badge-icon" style="font-size: 64px; margin-bottom: 15px;">🏆</div>
        <h1 id="achievement-title" style="color: #2e7d32; font-size: 1.5rem; margin-bottom: 10px;">Achievement Unlocked!</h1>
        <p id="achievement-desc">Congratulations on reaching a new milestone in Izon Language Learning with Lorek.</p>
        <a href="index.html" class="btn">Open Lorek App</a>
    </main>

    <footer>
        <p>&copy; 2026 Lorek App. All rights reserved.</p>
    </footer>

    <script>
        if (window.location.hash) {
            const hashParams = new URLSearchParams(window.location.hash.substring(1));
            const name = hashParams.get('name');
            const desc = hashParams.get('desc');
            const icon = hashParams.get('icon');

            if (name) document.getElementById('achievement-title').innerText = decodeURIComponent(name);
            if (desc) document.getElementById('achievement-desc').innerText = decodeURIComponent(desc);
            if (icon) document.getElementById('badge-icon').innerText = decodeURIComponent(icon);
        }
    </script>
</body>
</html>
