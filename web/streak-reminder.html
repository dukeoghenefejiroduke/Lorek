<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streak Reminder | Lorek</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Lorek Language App</h1>
    </header>

    <main class="container">
        <div style="font-size: 64px; margin-bottom: 15px;">🔥</div>
        <h1 style="color: #f57f17; font-size: 1.5rem; margin-bottom: 10px;">Protect Your Streak!</h1>
        <p>You've built amazing learning momentum. Don't let your streak slip away today!</p>
        
        <div style="margin: 20px 0; background: #fffde7; padding: 16px; border-radius: 12px; border: 2px dashed #fbc02d;">
            <h2 id="streak-count" style="margin: 0; color: #f57f17; font-size: 32px;">0 Days</h2>
            <p style="margin: 5px 0 0; color: #666; font-size: 14px;">Current Active Streak</p>
        </div>

        <a href="index.html" class="btn">Open Lorek App & Practice</a>
    </main>

    <footer>
        <p>&copy; 2026 Lorek App. All rights reserved.</p>
    </footer>

    <script>
        if (window.location.hash) {
            const hashParams = new URLSearchParams(window.location.hash.substring(1));
            const streak = hashParams.get('streak');

            if (streak) {
                document.getElementById('streak-count').innerText = `${streak} Day${streak > 1 ? 's' : ''}`;
            }
        }
    </script>
</body>
</html>
