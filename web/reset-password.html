<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Lorek</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Lorek Language App</h1>
    </header>

    <main class="container">
        <h1>Reset Password</h1>
        <p>Enter your new password below.</p>
        <div id="form-container">
            <input type="password" id="password" placeholder="New Password (min 8 chars)" required>
            <input type="password" id="confirmPassword" placeholder="Confirm New Password" required>
            <button onclick="resetPassword()">Reset Password</button>
        </div>
        <div id="status" class="status-message"></div>
    </main>

    <footer>
        <p>&copy; 2026 Lorek App. All rights reserved.</p>
    </footer>

    <script>
        async function resetPassword() {
            const hash = window.location.hash;
            const token = hash.includes('token=') ? hash.split('token=')[1] : null;
            
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const statusDiv = document.getElementById('status');

            if (!token) {
                statusDiv.innerHTML = '<span style="color: #d32f2f; font-weight: bold;">Error:</span> Invalid reset link (no token).';
                return;
            }

            if (!password || password.length < 8) {
                statusDiv.innerHTML = '<span style="color: #d32f2f; font-weight: bold;">Error:</span> Password must be at least 8 characters.';
                return;
            }

            if (password !== confirmPassword) {
                statusDiv.innerHTML = '<span style="color: #d32f2f; font-weight: bold;">Error:</span> Passwords do not match.';
                return;
            }

            try {
                const response = await fetch('https://lorek.onrender.com/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password })
                });

                const data = await response.json();
                if (response.ok && data.success) {
                    statusDiv.innerHTML = '<span style="color: #2e7d32; font-weight: bold;">Success!</span> Password reset successfully. You can now log in.';
                    document.getElementById('form-container').style.display = 'none';
                } else {
                    statusDiv.innerHTML = '<span style="color: #d32f2f; font-weight: bold;">Error:</span> ' + (data.error || 'Reset failed.');
                }
            } catch (error) {
                statusDiv.innerHTML = '<span style="color: #d32f2f; font-weight: bold;">Error:</span> Could not connect to server. (' + error.message + ')';
            }
        }
    </script>
</body>
</html>
