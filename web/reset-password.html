<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Lorek</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .container { padding: 50px; text-align: center; max-width: 400px; margin: auto; }
        input { display: block; width: 100%; margin: 10px 0; padding: 10px; }
        button { padding: 10px 20px; background-color: #4CAF50; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <main class="container">
        <h1>Reset Password</h1>
        <div id="form-container">
            <input type="password" id="password" placeholder="New Password" required>
            <input type="password" id="confirmPassword" placeholder="Confirm New Password" required>
            <button onclick="resetPassword()">Reset Password</button>
        </div>
        <div id="status"></div>
    </main>

    <script>
        async function resetPassword() {
            const hash = window.location.hash;
            const token = hash.includes('token=') ? hash.split('token=')[1] : null;
            
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const statusDiv = document.getElementById('status');

            if (!token) {
                statusDiv.innerText = 'Error: Invalid reset link (no token).';
                return;
            }

            if (password !== confirmPassword) {
                statusDiv.innerText = 'Error: Passwords do not match.';
                return;
            }

            try {
                const response = await fetch('https://lorek.onrender.com/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password })
                });

                const data = await response.json();
                if (response.ok && data.success) {
                    statusDiv.innerText = 'Success! Password reset. You can now log in.';
                    document.getElementById('form-container').style.display = 'none';
                } else {
                    statusDiv.innerText = 'Error: ' + (data.error || 'Reset failed.');
                }
            } catch (error) {
                statusDiv.innerText = 'Error: Could not connect to server.';
            }
        }
    </script>
</body>
</html>
